[package]
name = "smr-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "consensus_latency"
harness = false

[profile.release]
opt-level = 3
lto = true
